name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, sign, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main" >&2
            exit 1
          fi

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v6.2.0

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing" >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing" >&2; exit 1; }

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/exercise-db-release.jks"

      - name: Test and build signed release
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/exercise-db-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew
          testReleaseUnitTest
          assembleRelease
          bundleRelease
          -PversionName=${{ steps.version.outputs.version }}
          -PversionCode=${{ github.run_number }}

      - name: Verify and package files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_CERT_SHA256: 07905122c31a3933fbfda33b994b9817a344ea4881d6dfcffb16ea1d16fa07ed
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk | tee signer.txt
          grep -Fq "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" signer.txt
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/exercise-db-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/exercise-db-$VERSION.aab"
          cd dist
          sha256sum "exercise-db-$VERSION.apk" "exercise-db-$VERSION.aab" > checksums.txt

      - name: Upload signed artifacts
        uses: actions/upload-artifact@3f131e8634966bd73d06cc69884922b02e6faf92 # v7.0.1
        with:
          name: exercise-db-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exercise-db-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to replace published assets" >&2
            exit 1
          fi
          gh release create "$TAG_NAME" dist/* \
            --verify-tag \
            --title "Exercise DB $VERSION" \
            --generate-notes
